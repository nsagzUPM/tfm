<!-- src/main/resources/templates/fragments/layout.html -->
<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title th:text="${title} ?: 'Biblioteca'">Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<script th:src="@{/js/app.js}" defer></script>
<header class="topbar" th:fragment="topbar(userName, role)">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/menu}">
            <span class="brand-badge" aria-hidden="true"></span>
            <span>BIBLIOTECA UNIVERSIDAD POLITÉCNICA DE MADRID</span>
        </a>
        <div class="top-actions">
            <span class="chip" th:text="${userName} ?: 'Usuario'">Usuario</span>
            <span class="chip" th:text="${role} ?: 'Rol'">Rol</span>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn ghost" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>
</header>

<main class="container" th:fragment="content">
    <!-- content -->
</main>

<footer class="footer" th:fragment="footer">
    © Universidad Politécnica de Madrid - 2026
</footer>
</body>
</html>
