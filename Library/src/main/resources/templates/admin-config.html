<!-- src/main/resources/templates/admin-config.html -->
<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Configuración</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar(${userName}, ${role})}"></header>

<main class="container">
    <section class="card pad" style="max-width:820px;">
        <div class="row spread">
            <div>
                <h1 class="h1">Bibliotecario → Configuración del sistema</h1>
                <p class="p">Parámetros globales</p>
            </div>
            <a class="btn" th:href="@{/menu}">← Volver</a>
        </div>

        <div class="divider"></div>

        <form class="grid two" th:action="@{/librarian/config/save}" method="post">
            <div class="field">
                <label class="label">Duración préstamo estudiantes</label>
                <input class="input" name="loanDaysStudent" placeholder="15" th:value="${cfg.loanDaysStudent}">
            </div>
            <div class="field">
                <label class="label">Duración préstamo profesores</label>
                <input class="input" name="loanDaysProfessor" placeholder="30" th:value="${cfg.loanDaysProfessor}">
            </div>
            <div class="field">
                <label class="label">Días de sanción por día de retraso</label>
                <input class="input" name="penaltyMultiplier" placeholder="2" th:value="${cfg.penaltyMultiplier}">
            </div>
            <div class="field">
                <label class="label">Duración reservas</label>
                <input class="input" name="reservationDays" placeholder="3" th:value="${cfg.reservationDays}">
            </div>

            <div class="row" style="grid-column:1/-1;justify-content:flex-end;">
                <button class="btn primary" type="submit">Guardar cambios</button>
            </div>
        </form>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</main>
</body>
</html>
