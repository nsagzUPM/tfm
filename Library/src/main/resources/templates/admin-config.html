<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Configuración del sistema</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar(${userName}, ${role})}"></header>

<main class="container">
    <section class="card pad">
        <div class="row spread">
            <div>
                <h1 class="h1">Bibliotecario → Configuración del sistema</h1>
                <p class="p">Ajusta las reglas globales de préstamos, sanciones y reservas.</p>
            </div>
            <a class="btn" th:href="@{/menu}">← Volver</a>
        </div>

        <div class="divider"></div>

        <!-- Toasts -->
        <div th:if="${toastOk != null}" class="card pad"
             style="border-color: rgba(2,122,72,.35); background: rgba(2,122,72,.08);">
            <p class="p" th:text="${toastOk}">Cambios guardados ✅</p>
        </div>

        <div th:if="${toastErr != null}" class="card pad"
             style="border-color: rgba(180,35,24,.35); background: rgba(180,35,24,.08);">
            <p class="p" th:text="${toastErr}">Error</p>
        </div>

        <div class="divider" th:if="${toastOk != null || toastErr != null}"></div>

        <form method="post" th:action="@{/admin/config}" th:object="${form}" class="grid two">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="card pad">
                <h2 class="h2">Préstamos</h2>

                <div class="field">
                    <label class="label">Duración préstamo estudiantes (días)</label>
                    <input class="input" type="number" min="1" th:field="*{studentLoanDays}"/>
                    <p class="p" th:if="${#fields.hasErrors('studentLoanDays')}"
                       th:text="${#fields.errors('studentLoanDays')[0]}"></p>
                </div>

                <div class="field">
                    <label class="label">Duración préstamo profesores (días)</label>
                    <input class="input" type="number" min="1" th:field="*{professorLoanDays}"/>
                    <p class="p" th:if="${#fields.hasErrors('professorLoanDays')}"
                       th:text="${#fields.errors('professorLoanDays')[0]}"></p>
                </div>
            </div>

            <div class="card pad">
                <h2 class="h2">Sanciones y reservas</h2>

                <div class="field">
                    <label class="label">Días de sanción por día de retraso</label>
                    <input class="input" type="number" min="0" th:field="*{penaltyDaysPerLateDay}"/>
                    <p class="p" th:if="${#fields.hasErrors('penaltyDaysPerLateDay')}"
                       th:text="${#fields.errors('penaltyDaysPerLateDay')[0]}"></p>
                </div>

                <div class="field">
                    <label class="label">Duración reservas (días)</label>
                    <input class="input" type="number" min="1" th:field="*{reservationDays}"/>
                    <p class="p" th:if="${#fields.hasErrors('reservationDays')}"
                       th:text="${#fields.errors('reservationDays')[0]}"></p>
                </div>
            </div>

            <div class="row" style="gap:12px; align-items:center;">
                <button class="btn primary" type="submit">Guardar cambios</button>
                <a class="btn" th:href="@{/admin/config}">Restablecer</a>
            </div>
        </form>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
</body>
</html>
